org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
kotlin.code.style=official
org.gradle.caching=true
org.gradle.parallel=true

# JDK 不要写进版本库。
#
# Kotlin 2.0.x / AGP 8.9 还不支持 JDK 25（Studio 内置的 JBR 就是 25），用它编译会报
# "Unsupported class file major version"。但 JDK 21 装在哪台机器上、哪个路径，因人而异，
# 一旦把 org.gradle.java.home 写死，别人 clone 下来第一次 Sync 就直接失败。
# 所以这里留空：请在 Android Studio 的
#   Settings → Build, Execution, Deployment → Build Tools → Gradle → Gradle JDK
# 里选 21（或 17）。命令行构建时可用 `JAVA_HOME` 指定。

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
