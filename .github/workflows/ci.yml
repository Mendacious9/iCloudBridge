name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 同一分支上的旧任务直接取消，避免排队
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Protocol tests (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # core/icloud 本身是纯 JVM 模块，但 settings.gradle 里 include(":app")
      # 会在配置阶段应用 AGP，所以配置阶段就需要一个可用的 SDK。
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      # ubuntu-latest 镜像自带 Android SDK 且已接受 license。
      # 原先这里用 android-actions/setup-android@v3，两次运行都败在这一步
      # （action 要另下一套 cmdline-tools）。预装的够用，就不再引这个变量。
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # app 层的单测是纯 Kotlin（清单解析、强制更新边界、语言回退），
      # 不碰 Android framework，因此普通 JVM 单测就能跑，不需要模拟器。
      - name: Run unit tests
        run: ./gradlew :core:icloud:test :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            core/icloud/build/reports/tests/
            app/build/reports/tests/
          retention-days: 7

  assemble:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      # ubuntu-latest 镜像自带 Android SDK 且已接受 license。
      # 原先这里用 android-actions/setup-android@v3，两次运行都败在这一步
      # （action 要另下一套 cmdline-tools）。预装的够用，就不再引这个变量。
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 没有 keystore/keystore.properties 时签名配置会被跳过，
      # debug 包本来就用 debug key，能直接产出。
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
